<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Роман & Валерия</title>

<style>
body{
    margin:0;
    font-family:Georgia, serif;
    background:#f8f4ef;
    color:#4d4d4d;
    text-align:center;
}

.hero{
    padding:100px 20px;
}

h1{
    font-size:60px;
    font-weight:300;
    margin-bottom:10px;
}

.date{
    font-size:24px;
    letter-spacing:3px;
}

.section{
    padding:60px 20px;
    max-width:800px;
    margin:auto;
}

.form{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input, select{
    width:90%;
    padding:12px;
    margin:10px 0;
}

button{
    background:#b69b7c;
    color:white;
    border:none;
    padding:15px 30px;
    cursor:pointer;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="hero">
<h1>Роман & Валерия</h1>
<div class="date">31.10.2026</div>
</div>

<div class="section">
<h2>Мы будем счастливы разделить этот день с вами</h2>

<p>
Церемония и банкет состоятся по одному адресу.
</p>

<p>
Просим подтвердить присутствие до 20.10.2026
</p>
</div>

<div class="section">
<div class="form">

<h2>Подтверждение присутствия</h2>

<input type="text" placeholder="Ваше имя">

<br>

<select>
<option>Буду присутствовать</option>
<option>К сожалению, не смогу</option>
</select>

<br>

<button>Отправить</button>

</div>
</div>

</body>
</html>
